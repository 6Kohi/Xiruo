spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/xiruo_test_db
    username: xiruo_test_user
    password: xiruo_test_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: false
  
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 2000ms

logging:
  level:
    com.xiruo: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG