version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: xiruo-postgres
    environment:
      POSTGRES_DB: xiruo_db
      POSTGRES_USER: xiruo_user
      POSTGRES_PASSWORD: xiruo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - xiruo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiruo_user -d xiruo_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:latest
    container_name: xiruo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - xiruo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  xiruo-network:
    driver: bridge