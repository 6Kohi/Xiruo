version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: xiruo-postgres-test
    environment:
      POSTGRES_DB: xiruo_test_db
      POSTGRES_USER: xiruo_test_user
      POSTGRES_PASSWORD: xiruo_test_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiruo_test_user -d xiruo_test_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: xiruo-redis-test
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
  redis_test_data: