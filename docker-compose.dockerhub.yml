services:
  xiruo:
    image: "${XIRUO_IMAGE:-6kohi/xiruo:latest}"
    container_name: xiruo
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${XIRUO_PORT:-3100}:3000"
    environment:
      PORT: 3000
      XIRUO_ENABLE_REAL_SOURCES: "true"
      XIRUO_PROXY_SECRET: "${XIRUO_PROXY_SECRET:-}"
      XIRUO_DATA_DIR: /data
      XIRUO_CACHE_SERVICE: http://127.0.0.1:4011
      XIRUO_CACHE_SERVICE_PORT: 4011
      XIRUO_SOURCE_GATEWAY: "${XIRUO_SOURCE_GATEWAY:-}"
      XIRUO_SOURCE_GATEWAY_PORT: 4010
    volumes:
      - "${XIRUO_DATA_PATH:-./data}:/data"
